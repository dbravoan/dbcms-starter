name: Comprobaciones del proyecto
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exigir dependencias fijadas
        run: test -f composer.lock && test -f package-lock.json
      - name: Verificar con archivos y base de datos desechables
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: docker compose -p project-quality -f docker/ci/compose.yml run --build --rm -T app
      - name: Limpiar servicios desechables
        if: always()
        run: docker compose -p project-quality -f docker/ci/compose.yml down --volumes --remove-orphans
